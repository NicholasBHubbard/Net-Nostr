name: run-tests

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'Changes'
      - 'README.md'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'Changes'
      - 'README.md'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PERL_CPANM_OPT: --verbose --no-interactive
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            perl: '5.16'
          - os: ubuntu-latest
            perl: latest
          - os: macos-latest
            perl: latest
          - os: windows-latest
            perl: latest
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    defaults:
      run:
        # Bash on Windows can select the system Perl instead of the setup action's Perl.
        shell: perl {0}
    steps:
      - uses: actions/checkout@v4

      - uses: shogo82148/actions-setup-perl@v1
        id: perl
        with:
          perl-version: ${{ matrix.perl }}
          # Cache against the distribution manifests below instead of the action's default.
          enable-modules-cache: false

      - uses: actions/cache@v4
        with:
          path: local
          key: perl-${{ runner.os }}-${{ runner.arch }}-${{ steps.perl.outputs.perl-version }}-${{ steps.perl.outputs.perl-hash }}-${{ hashFiles('dist/*/Makefile.PL', '.github/workflows/test.yml') }}

      - name: Install author test dependencies
        run: |
          use strict;
          use warnings;
          system($^X, '-S', 'cpanm', '--local-lib', 'local', 'Test::Pod', 'Test::Pod::Coverage') == 0
              or die "Installing author test dependencies failed\n";

      - name: Build and test Core
        run: |
          use strict;
          use warnings;
          use Config qw(%Config);
          system($^X, '-S', 'cpanm', '--local-lib', 'local', '--installdeps', './dist/Net-Nostr-Core') == 0
              or die "Installing Core dependencies failed\n";
          chdir 'dist/Net-Nostr-Core' or die "chdir Core: $!\n";
          system($^X, 'Makefile.PL', "INSTALL_BASE=$ENV{GITHUB_WORKSPACE}/local") == 0
              or die "Configuring Core failed\n";
          for my $target (qw(all test)) {
              system($Config{make}, $target) == 0 or die "Core: $target failed\n";
          }
          system($^X, '-S', 'prove', '-v', glob('t/author/*.t')) == 0
              or die "Core: author checks failed\n";
          system($Config{make}, 'install') == 0 or die "Core: install failed\n";

      - name: Build and test Client
        run: |
          use strict;
          use warnings;
          use Config qw(%Config);
          system($^X, '-S', 'cpanm', '--local-lib', 'local', '--installdeps', './dist/Net-Nostr-Client') == 0
              or die "Installing Client dependencies failed\n";
          chdir 'dist/Net-Nostr-Client' or die "chdir Client: $!\n";
          system($^X, 'Makefile.PL', "INSTALL_BASE=$ENV{GITHUB_WORKSPACE}/local") == 0
              or die "Configuring Client failed\n";
          for my $target (qw(all test)) {
              system($Config{make}, $target) == 0 or die "Client: $target failed\n";
          }
          system($^X, '-S', 'prove', '-v', glob('t/author/*.t')) == 0
              or die "Client: author checks failed\n";
          system($Config{make}, 'install') == 0 or die "Client: install failed\n";

      - name: Build and test Relay
        run: |
          use strict;
          use warnings;
          use Config qw(%Config);
          system($^X, '-S', 'cpanm', '--local-lib', 'local', '--installdeps', './dist/Net-Nostr-Relay') == 0
              or die "Installing Relay dependencies failed\n";
          chdir 'dist/Net-Nostr-Relay' or die "chdir Relay: $!\n";
          system($^X, 'Makefile.PL', "INSTALL_BASE=$ENV{GITHUB_WORKSPACE}/local") == 0
              or die "Configuring Relay failed\n";
          for my $target (qw(all test)) {
              system($Config{make}, $target) == 0 or die "Relay: $target failed\n";
          }
          system($^X, '-S', 'prove', '-v', glob('t/author/*.t')) == 0
              or die "Relay: author checks failed\n";
          system($Config{make}, 'install') == 0 or die "Relay: install failed\n";

      - name: Build and test shim
        run: |
          use strict;
          use warnings;
          use Config qw(%Config);
          system($^X, '-S', 'cpanm', '--local-lib', 'local', '--installdeps', './dist/Net-Nostr') == 0
              or die "Installing shim dependencies failed\n";
          chdir 'dist/Net-Nostr' or die "chdir shim: $!\n";
          system($^X, 'Makefile.PL', "INSTALL_BASE=$ENV{GITHUB_WORKSPACE}/local") == 0
              or die "Configuring shim failed\n";
          for my $target (qw(all test)) {
              system($Config{make}, $target) == 0 or die "shim: $target failed\n";
          }
          system($^X, '-S', 'prove', '-v', glob('t/author/*.t')) == 0
              or die "shim: author checks failed\n";
          system($Config{make}, 'install') == 0 or die "shim: install failed\n";
