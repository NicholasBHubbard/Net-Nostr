name: AnyEvent TLS shutdown investigation

on:
  push:
    branches: [ci/anyevent-tls-investigation]
    paths:
      - '.github/workflows/anyevent-tls-investigation.yml'
      - 'maint/ci/investigate-anyevent-tls.pl'

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            perl: latest
          - os: macos-latest
            perl: latest
    env:
      PERL_CPANM_OPT: --verbose --no-interactive
      PERL_CPANM_HOME: ${{ github.workspace }}/cpanm-tls-investigation
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          enable-modules-cache: false
      - name: Compare TLS shutdown sequences
        shell: perl {0}
        run: |
          use strict;
          use warnings;
          system($^X, 'maint/ci/investigate-anyevent-tls.pl') == 0
              or die "TLS investigation failed\n";
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anyevent-tls-${{ matrix.os }}
          path: |
            anyevent-tls-results.json
            cpanm-tls-investigation/work/*/build.log
            tls-variants/*.t
